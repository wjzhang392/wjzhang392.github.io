  <p>
    I am a Software Engineer at <a href="https://about.google/" target="_blank">Google</a>, working on improving Ads
    ranking and personalization.
    I completed my Ph.D. at the <a href="https://irlab.science.uva.nl/" target="_blank">Information Retrieval Lab</a>,
    University of Amsterdam, under the supervision of
    <a href="https://staff.fnwi.uva.nl/e.kanoulas/" target="_blank">Prof. Evangelos Kanoulas</a>.
  </p>
  <p>
    My research sits at the intersection of information retrieval and natural language generation, with a particular
    focus on factuality in unstructured text generation and reasoning over structured data such as tables.
